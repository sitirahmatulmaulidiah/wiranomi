<script>
    {% if messages %}
    document.addEventListener('DOMContentLoaded', function() {

        {% for message in messages %}
        let iconType = "info";
        let alertTitle = "Info";

        let currentUrl = window.location.pathname;

        if ("{{ message.tags }}".includes("success")) {
            iconType = "success";
            
            if (currentUrl.includes("pengaturan")) {
                alertTitle = "Berhasil di Edit!";
            } else {
                alertTitle = "Berhasil Masuk!";
            }
        }

        if ("{{ message.tags }}".includes("error")) {
            iconType = "error";
            alertTitle = "Gagal";
        }

        Swal.fire({
            icon: iconType,
            title: alertTitle,
            text: "{{ message|escapejs }}",
            showConfirmButton: false,
            timer: 2500
        });
        {% endfor %}

    });
    {% endif %}

    function konfirmasiLogout(event) {
        event.preventDefault();
        Swal.fire({
            title: 'Yakin ingin keluar?',
            text: "Anda akan keluar dari dashboard Guru.",
            icon: 'warning',
            width: 'auto',
            height: '300px',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Ya, Logout',
            cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                document.getElementById('form-logout-guru').submit();
            }
        });
    }
</script>
